<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUIZORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1><img src="logo.png" alt="Logo Quizora" class="logo"> QUIZORA</h1>
    <nav aria-label="Navigasi utama">
      <button class="nav-btn" data-view="beranda">Beranda</button>
    </nav>
  </header>

  <main>
    <!-- Beranda Siswa -->
    <section id="beranda" class="view">
      <div class="brand"><img src="logo.png" alt="Logo Quizora" class="brand-logo"><span class="brand-teks">QUIZORA</span></div>
      <p class="sub">Masukkan PIN yang tampil di layar Admin.</p>
      <form id="form-kode" class="card form kode-form">
        <label for="kode">PIN ROOM</label>
        <input type="text" id="kode" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="off" required>
        <p id="pesan-kode" class="error" role="alert"></p>
        <button class="btn" type="submit">JOIN</button>
      </form>
      <p class="guru-link"><button class="link-btn" data-view="guru-login">Masuk sebagai Admin</button></p>
    </section>

    <!-- JOIN -->
    <section id="gabung" class="view" hidden>
      <div class="brand"><img src="logo.png" alt="Logo Quizora" class="brand-logo"><span class="brand-teks">QUIZORA</span></div>
      <p class="sub" id="judul-gabung">Kuis</p>
      <form id="form-nama" class="card form">
        <label for="nama">Nama Panggilan</label>
        <input type="text" id="nama" maxlength="15" placeholder="Masukkan nama panggilan kamu" autocomplete="off" required>
        <fieldset>
          <legend>Pilih avatar</legend>
          <div id="avatar-pilih" class="avatar-grid"></div>
        </fieldset>
        <button class="btn" type="submit">LET'S GO!</button>
      </form>
      <p class="catatan">Jangan gunakan nama aslinya ya!</p>
    </section>

    <!-- LOGIN ADMIN -->
    <section id="guru-login" class="view" hidden>
      <div class="brand"><img src="logo.png" alt="Logo Quizora" class="brand-logo"><span class="brand-teks">QUIZORA</span></div>
      <p class="sub">Masuk sebagai Admin</p>
      <form id="form-login" class="card form kode-form" autocomplete="off">
        <label for="user">Username</label>
        <input type="text" id="user" placeholder="Example : guru" autocomplete="off" required>
        <label for="pin">Password</label>
        <input type="password" id="pin" placeholder="Example : guru123" autocomplete="off" required>
        <label class="tampil-pass"><input type="checkbox" id="lihat-pass"> Tampilkan password</label>
        <p id="pesan-login" class="error" role="alert"></p>
        <button class="btn" type="submit">Masuk</button>
      </form>
      <p class="guru-link"><button class="link-btn" data-view="beranda">← Kembali ke Beranda</button></p>
    </section>
    <!-- PANEL ADMIN -->
    <section id="guru-panel" class="view" hidden>
      <h2>ADMIN MENU</h2>
      <div class="panel-grid">
        <article class="card">
          <h3>Kuis Saya</h3>
          <form id="form-kuis" class="form">
            <label for="judul-kuis">Judul kuis baru</label>
            <input type="text" id="judul-kuis" required>
            <button class="btn" type="submit">Buat Kuis</button>
          </form>
          <ul id="daftar-kuis" class="daftar"></ul>
        </article>

        <article id="editor" class="card" hidden>
          <h3>Soal : <span id="judul-editor"></span></h3>
          <form id="form-soal" class="form">
            <label for="tanya">Pertanyaan</label>
            <input type="text" id="tanya" required>
            <fieldset>
              <legend>Pilihan (pilih bulatan untuk jawaban benar)</legend>
              <div class="opsi-input"><input type="radio" name="benar" value="0" checked aria-label="Opsi A benar"><input type="text" class="opsi" aria-label="Pilihan A" placeholder="A" required></div>
              <div class="opsi-input"><input type="radio" name="benar" value="1" aria-label="Opsi B benar"><input type="text" class="opsi" aria-label="Pilihan B" placeholder="B" required></div>
              <div class="opsi-input"><input type="radio" name="benar" value="2" aria-label="Opsi C benar"><input type="text" class="opsi" aria-label="Pilihan C" placeholder="C" required></div>
              <div class="opsi-input"><input type="radio" name="benar" value="3" aria-label="Opsi D benar"><input type="text" class="opsi" aria-label="Pilihan D" placeholder="D" required></div>
            </fieldset>
            <label for="waktu">Waktu menjawab</label>
            <select id="waktu"><option value="10">10 detik</option><option value="20" selected>20 detik</option><option value="30">30 detik</option></select>
            <button class="btn" type="submit">Tambah Soal</button>
          </form>
          <ul id="daftar-soal" class="daftar"></ul>
        </article>
      </div>
    </section>
</body>
</html>
