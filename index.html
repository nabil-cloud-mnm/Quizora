<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QUIZORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1><img src="logo.png" alt="Logo Quizora" class="logo"> QUIZORA</h1>
    <nav aria-label="Navigasi utama">
      <button class="nav-btn" data-view="beranda">Beranda</button>
    </nav>
  </header>

  <main>
    <!-- Beranda Siswa -->
    <section id="beranda" class="view">
      <div class="brand"><img src="logo.png" alt="Logo Quizora" class="brand-logo"><span class="brand-teks">QUIZORA</span></div>
      <p class="sub">Masukkan PIN yang tampil di layar Admin.</p>
      <form id="form-kode" class="card form kode-form">
        <label for="kode">PIN ROOM</label>
        <input type="text" id="kode" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="off" required>
        <p id="pesan-kode" class="error" role="alert"></p>
        <button class="btn" type="submit">JOIN</button>
      </form>
      <p class="guru-link"><button class="link-btn" data-view="guru-login">Masuk sebagai Admin</button></p>
    </section>

    <!-- JOIN -->
    <section id="gabung" class="view" hidden>
      <div class="brand"><img src="logo.png" alt="Logo Quizora" class="brand-logo"><span class="brand-teks">QUIZORA</span></div>
      <p class="sub" id="judul-gabung">Kuis</p>
      <form id="form-nama" class="card form">
        <label for="nama">Nama Panggilan</label>
        <input type="text" id="nama" maxlength="15" placeholder="Masukkan nama panggilan kamu" autocomplete="off" required>
        <fieldset>
          <legend>Pilih avatar</legend>
          <div id="avatar-pilih" class="avatar-grid"></div>
        </fieldset>
        <button class="btn" type="submit">LET'S GO!</button>
      </form>
      <p class="catatan">Jangan gunakan nama aslinya ya!</p>
    </section>

    

    

  
</body>
